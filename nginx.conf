events {}

http {
    upstream backend {
        least_conn;
        server api01:8080;
        server api02:8080;
    }

    server {
        listen 80;

        location / {
            proxy_pass http://backend;

            proxy_http_version 1.1;
            proxy_set_header Connection "";
            proxy_set_header Host $host;
            proxy_set_header X-Real-IP $remote_addr;
        }
    }
}