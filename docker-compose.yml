version: "3.9"

services:

  # ============================================================
  # 🔥 NGINX - LOAD BALANCER
  # ============================================================
  load-balancer:
    image: nginx:alpine
    container_name: rinha_nginx
    ports:
      - "9999:80"
    volumes:
      - ./nginx.conf:/etc/nginx/nginx.conf:ro
    depends_on:
      - api01
      - api02
    networks:
      - rinha-net
    deploy:
      resources:
        limits:
          cpus: "0.10"
          memory: "30M"

  # ============================================================
  # 🐘 POSTGRES
  # ============================================================
  db:
    image: postgres:16-alpine
    container_name: postgres_rinha
    restart: always
    environment:
      POSTGRES_USER: postgres
      POSTGRES_PASSWORD: postgres
      POSTGRES_DB: rinha
    networks:
      - rinha-net
    command: >
      postgres
      -c max_connections=200
      -c shared_buffers=25MB
      -c synchronous_commit=off
      -c full_page_writes=off
      -c wal_buffers=4MB
      -c effective_cache_size=50MB
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U postgres"]
      interval: 5s
      timeout: 3s
      retries: 10
    deploy:
      resources:
        limits:
          cpus: "0.20"
          memory: "100M"

  # ============================================================
  # ⚡ KAFKA (KRaft)
  # ============================================================
  kafka:
    image: confluentinc/cp-kafka:7.5.0
    container_name: kafka
    environment:
      KAFKA_PROCESS_ROLES: broker,controller
      KAFKA_NODE_ID: 1
      KAFKA_CONTROLLER_QUORUM_VOTERS: 1@kafka:9093

      KAFKA_LISTENERS: PLAINTEXT://0.0.0.0:9092,CONTROLLER://0.0.0.0:9093
      KAFKA_ADVERTISED_LISTENERS: PLAINTEXT://kafka:9092

      KAFKA_LISTENER_SECURITY_PROTOCOL_MAP: CONTROLLER:PLAINTEXT,PLAINTEXT:PLAINTEXT
      KAFKA_CONTROLLER_LISTENER_NAMES: CONTROLLER

      KAFKA_OFFSETS_TOPIC_REPLICATION_FACTOR: 1
      KAFKA_GROUP_INITIAL_REBALANCE_DELAY_MS: 0

      CLUSTER_ID: VQ71w0MFQ5eHgF4PIQJ5jQ

      # 🔥 tuning leve
      KAFKA_HEAP_OPTS: "-Xmx80M -Xms80M"
      KAFKA_LOG_CLEANER_ENABLE: "false"
    networks:
      - rinha-net
    healthcheck:
      test: ["CMD-SHELL", "kafka-topics --bootstrap-server localhost:9092 --list || exit 1"]
      interval: 10s
      timeout: 5s
      retries: 10
    deploy:
      resources:
        limits:
          cpus: "0.20"
          memory: "100M"

  # ============================================================
  # 📊 KAFKA UI
  # ============================================================
  kafka-ui:
    image: provectuslabs/kafka-ui:latest
    container_name: kafka_ui
    ports:
      - "9094:8080"
    environment:
      KAFKA_CLUSTERS_0_NAME: local
      KAFKA_CLUSTERS_0_BOOTSTRAPSERVERS: kafka:9092
      JAVA_OPTS: "-Xmx64M -Xms64M"
    depends_on:
      kafka:
        condition: service_healthy
    networks:
      - rinha-net
    deploy:
      resources:
        limits:
          cpus: "0.10"
          memory: "70M"

  # ============================================================
  # 🚀 APIs
  # ============================================================
  api01: &api_config
    build: .
    environment:
      SPRING_PROFILES_ACTIVE: prod
      SPRING_KAFKA_BOOTSTRAP_SERVERS: kafka:9092
      SPRING_DATASOURCE_URL: jdbc:postgresql://db:5432/rinha
      SPRING_DATASOURCE_USERNAME: postgres
      SPRING_DATASOURCE_PASSWORD: postgres

      JAVA_TOOL_OPTIONS: >
        -Xms80M
        -Xmx80M
        -XX:+UseSerialGC
        -XX:MaxRAMPercentage=75
        -XX:+AlwaysPreTouch
    expose:
      - "8080"
    depends_on:
      db:
        condition: service_healthy
      kafka:
        condition: service_healthy
    networks:
      - rinha-net
    deploy:
      resources:
        limits:
          cpus: "0.50"
          memory: "120M"

  api02:
    <<: *api_config

networks:
  rinha-net:
    driver: bridge