version: "3.9"

services:

  # ============================================================
  # 1) LOAD BALANCER - NGINX
  # ============================================================
  load-balancer:
    image: nginx:alpine
    container_name: rinha_nginx
    ports:
      - "9999:9999"
    volumes:
      - ./nginx.conf:/etc/nginx/nginx.conf:ro
    depends_on:
      - api01
      - api02
    networks:
      - rinha-net
    deploy:
      resources:
        limits:
          cpus: "0.10"
          memory: "40M"

  # ============================================================
  # 2) POSTGRES
  # ============================================================
  db:
    image: postgres:16-alpine
    container_name: postgres_rinha
    restart: always
    environment:
      POSTGRES_USER: postgres
      POSTGRES_PASSWORD: postgres
      POSTGRES_DB: rinha
    networks:
      - rinha-net
    volumes:
      - postgres_data:/var/lib/postgresql/data
    # healthcheck opcional (não trava mais o sistema)
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U postgres"]
      interval: 5s
      timeout: 3s
      retries: 20
      start_period: 20s
    deploy:
      resources:
        limits:
          cpus: "0.40"
          memory: "150M"

  # ============================================================
  # 3) API INSTANCIA 01
  # ============================================================
  api01:
    build: .
    container_name: backend_rinha_01
    environment:
      SPRING_PROFILES_ACTIVE: prod
      SPRING_DATASOURCE_URL: jdbc:postgresql://db:5432/rinha
      SPRING_DATASOURCE_USERNAME: postgres
      SPRING_DATASOURCE_PASSWORD: postgres
    expose:
      - "8080"
    depends_on:
      - db
    networks:
      - rinha-net
    deploy:
      resources:
        limits:
          cpus: "0.60"
          memory: "230M"

  # ============================================================
  # 4) API INSTANCIA 02
  # ============================================================
  api02:
    build: .
    container_name: backend_rinha_02
    environment:
      SPRING_PROFILES_ACTIVE: prod
      SPRING_DATASOURCE_URL: jdbc:postgresql://db:5432/rinha
      SPRING_DATASOURCE_USERNAME: postgres
      SPRING_DATASOURCE_PASSWORD: postgres
    expose:
      - "8080"
    depends_on:
      - db
    networks:
      - rinha-net
    deploy:
      resources:
        limits:
          cpus: "0.60"
          memory: "230M"

# ============================================================
# NETWORK
# ============================================================
networks:
  rinha-net:
    driver: bridge

# ============================================================
# VOLUME
# ============================================================
volumes:
  postgres_data: